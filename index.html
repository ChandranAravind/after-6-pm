<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Internet Blackboard</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        color: white;
    }

    /* ---------------- HEADER ---------------- */

    .header {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        background: #090909;
        border-bottom: 1px solid #222;
        position: relative;
        z-index: 20;
    }

    .title {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.5px;
    }

    .subtitle {
        font-size: 12px;
        color: #777;
        margin-top: 4px;
    }

    .online {
        font-size: 13px;
        color: #72ff8a;
        display: flex;
        align-items: center;
        gap: 7px;
    }

    .dot {
        width: 8px;
        height: 8px;
        background: #72ff8a;
        border-radius: 50%;
        box-shadow: 0 0 10px #72ff8a;
    }

    /* ---------------- BOARD ---------------- */

    #boardContainer {
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;
        bottom: 0;
        background:
            radial-gradient(circle at 50% 50%, #111 0%, #050505 70%);
        overflow: hidden;
    }

    canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: none;
    }

    /* ---------------- BROOM ---------------- */

    #broom {
        position: fixed;
        pointer-events: none;
        z-index: 50;
        font-size: 42px;
        transform: translate(-8px, -38px) rotate(-20deg);
        display: none;
        filter: drop-shadow(0 3px 4px rgba(0,0,0,0.8));
    }

    /* ---------------- INSTRUCTIONS ---------------- */

    .instructions {
        position: absolute;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;

        background: rgba(0,0,0,0.72);
        border: 1px solid #292929;
        border-radius: 14px;

        padding: 12px 18px;

        text-align: center;
        pointer-events: none;

        backdrop-filter: blur(10px);
    }

    .instructions strong {
        display: block;
        font-size: 14px;
    }

    .instructions span {
        display: block;
        margin-top: 4px;
        color: #888;
        font-size: 11px;
    }

    /* ---------------- CONTROLS ---------------- */

    .controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);

        z-index: 30;

        display: flex;
        align-items: center;
        gap: 10px;

        background: rgba(12,12,12,0.9);
        border: 1px solid #292929;
        border-radius: 18px;
        padding: 10px;

        backdrop-filter: blur(12px);
    }

    .color {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
    }

    .color.active {
        border-color: white;
        transform: scale(1.12);
    }

    .white {
        background: white;
    }

    .yellow {
        background: #ffe66d;
    }

    .pink {
        background: #ff7eb6;
    }

    .blue {
        background: #70b7ff;
    }

    .green {
        background: #7dff9a;
    }

    button {
        border: none;
        background: #202020;
        color: white;
        border-radius: 10px;
        padding: 9px 13px;
        cursor: pointer;
        font-weight: 700;
    }

    button:hover {
        background: #303030;
    }

    .clear {
        background: #351919;
    }

    .clear:hover {
        background: #542020;
    }

    /* ---------------- WELCOME ---------------- */

    #welcome {
        position: fixed;
        inset: 0;
        z-index: 100;

        background: rgba(0,0,0,0.94);

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 25px;
    }

    .welcomeBox {
        width: min(450px, 100%);
        text-align: center;

        background: #101010;
        border: 1px solid #292929;
        border-radius: 24px;

        padding: 35px 25px;

        box-shadow: 0 20px 80px rgba(0,0,0,0.7);
    }

    .bigBroom {
        font-size: 65px;
        margin-bottom: 10px;
    }

    .welcomeBox h1 {
        margin: 0;
        font-size: 28px;
    }

    .welcomeBox p {
        color: #888;
        line-height: 1.6;
        font-size: 14px;
    }

    .enter {
        margin-top: 15px;
        padding: 13px 25px;
        background: white;
        color: black;
        font-size: 15px;
        border-radius: 12px;
    }

    .enter:hover {
        background: #ddd;
    }

    /* ---------------- MOBILE ---------------- */

    @media (max-width: 600px) {

        .header {
            height: 60px;
            padding: 0 14px;
        }

        .title {
            font-size: 16px;
        }

        .subtitle {
            font-size: 10px;
        }

        .online {
            font-size: 11px;
        }

        #boardContainer {
            top: 60px;
        }

        .instructions {
            top: 15px;
            width: 85%;
        }

        .instructions strong {
            font-size: 12px;
        }

        .instructions span {
            font-size: 10px;
        }

        .controls {
            bottom: 12px;
            gap: 7px;
            padding: 8px;
        }

        .color {
            width: 22px;
            height: 22px;
        }

        button {
            padding: 8px 9px;
            font-size: 11px;
        }
    }
</style>
</head>

<body>

<!-- WELCOME SCREEN -->

<div id="welcome">

    <div class="welcomeBox">

        <div class="bigBroom">🧹</div>

        <h1>The Internet Blackboard</h1>

        <p>
            Someone wrote something here before you.
            <br>
            Now it's your turn to mess with it.
        </p>

        <p>
            Take the broom.
            <br>
            Write something.
            <br>
            Change what someone else wrote.
        </p>

        <button class="enter" onclick="enterBoard()">
            ENTER THE BOARD
        </button>

    </div>

</div>


<!-- HEADER -->

<div class="header">

    <div>
        <div class="title">
            🧹 THE INTERNET BLACKBOARD
        </div>

        <div class="subtitle">
            One board. Everyone.
        </div>
    </div>

    <div class="online">
        <div class="dot"></div>
        <span id="onlineCount">Connecting...</span>
    </div>

</div>


<!-- BOARD -->

<div id="boardContainer">

    <canvas id="canvas"></canvas>

    <div id="broom">🧹</div>

    <div class="instructions">
        <strong>Grab the broom & write.</strong>
        <span>Someone else might change it after you.</span>
    </div>

    <!-- CONTROLS -->

    <div class="controls">

        <div
            class="color white active"
            onclick="setColor('#ffffff', this)">
        </div>

        <div
            class="color yellow"
            onclick="setColor('#ffe66d', this)">
        </div>

        <div
            class="color pink"
            onclick="setColor('#ff7eb6', this)">
        </div>

        <div
            class="color blue"
            onclick="setColor('#70b7ff', this)">
        </div>

        <div
            class="color green"
            onclick="setColor('#7dff9a', this)">
        </div>

        <button onclick="setSize(3)">
            Thin
        </button>

        <button onclick="setSize(7)">
            Thick
        </button>

        <button class="clear" onclick="clearBoard()">
            Clear
        </button>

    </div>

</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    remove,
    onValue,
    onDisconnect,
    set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
    getAuth,
    signInAnonymously
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =========================================================
   YOUR FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyCqdTn8x6P6xUXg2w5tRdoKqDvnmpktDv4",

    authDomain: "after-6-pm-98ee0.firebaseapp.com",

    databaseURL:
    "https://after-6-pm-98ee0-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId: "after-6-pm-98ee0",

    storageBucket:
    "after-6-pm-98ee0.firebasestorage.app",

    messagingSenderId: "961074687261",

    appId:
    "1:961074687261:web:0dd9f27f31621eb2745f4",

    measurementId: "G-7CHK765Q6N"
};


/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);


/* =========================================================
   ANONYMOUS LOGIN
========================================================= */

try {

    await signInAnonymously(auth);

    console.log("Anonymous user connected.");

} catch (error) {

    console.error("Authentication error:", error);

}


/* =========================================================
   CANVAS
========================================================= */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const container =
document.getElementById("boardContainer");

const broom =
document.getElementById("broom");


let drawing = false;

let currentColor = "#ffffff";

let currentSize = 4;

let currentStroke = [];


/* =========================================================
   RESIZE CANVAS
========================================================= */

function resizeCanvas() {

    const oldCanvas =
    document.createElement("canvas");

    oldCanvas.width = canvas.width;

    oldCanvas.height = canvas.height;

    oldCanvas.getContext("2d")
    .drawImage(canvas, 0, 0);

    const rect =
    container.getBoundingClientRect();

    canvas.width = rect.width * devicePixelRatio;

    canvas.height = rect.height * devicePixelRatio;

    canvas.style.width = rect.width + "px";

    canvas.style.height = rect.height + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   COORDINATES
========================================================= */

function getPosition(event) {

    const rect =
    canvas.getBoundingClientRect();

    return {

        x: event.clientX - rect.left,

        y: event.clientY - rect.top

    };
}


/* =========================================================
   BROOM FOLLOWING MOUSE
========================================================= */

document.addEventListener(
    "pointermove",
    function(event) {

        broom.style.left =
        event.clientX + "px";

        broom.style.top =
        event.clientY + "px";

        if (event.target === canvas) {

            broom.style.display = "block";

        } else {

            broom.style.display = "none";

        }

    }
);


/* =========================================================
   START DRAWING
========================================================= */

canvas.addEventListener(
    "pointerdown",
    function(event) {

        drawing = true;

        canvas.setPointerCapture(
            event.pointerId
        );

        const point =
        getPosition(event);

        currentStroke = [point];

    }
);


/* =========================================================
   DRAW
========================================================= */

canvas.addEventListener(
    "pointermove",
    function(event) {

        if (!drawing) return;

        const point =
        getPosition(event);

        currentStroke.push(point);

        /* Temporary local drawing */

        drawSegment(
            currentStroke[
                currentStroke.length - 2
            ],
            point,
            currentColor,
            currentSize
        );

    }
);


/* =========================================================
   FINISH STROKE
========================================================= */

canvas.addEventListener(
    "pointerup",
    finishStroke
);

canvas.addEventListener(
    "pointercancel",
    finishStroke
);

async function finishStroke(event) {

    if (!drawing) return;

    drawing = false;

    try {

        canvas.releasePointerCapture(
            event.pointerId
        );

    } catch(e) {}


    if (currentStroke.length < 2) {

        currentStroke = [];

        return;

    }


    /* Save the complete stroke */

    const strokesRef =
    ref(db, "blackboard/strokes");

    await push(
        strokesRef,
        {

            points: currentStroke,

            color: currentColor,

            size: currentSize,

            createdAt: Date.now()

        }
    );


    currentStroke = [];

}


/* =========================================================
   DRAW SEGMENT
========================================================= */

function drawSegment(
    a,
    b,
    color,
    size
) {

    ctx.beginPath();

    ctx.moveTo(a.x, a.y);

    ctx.lineTo(b.x, b.y);

    ctx.strokeStyle = color;

    ctx.lineWidth = size;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.stroke();

}


/* =========================================================
   DRAW COMPLETE STROKE
========================================================= */

function drawStroke(stroke) {

    if (!stroke.points ||
        stroke.points.length < 2) return;


    ctx.beginPath();

    ctx.moveTo(
        stroke.points[0].x,
        stroke.points[0].y
    );


    for (
        let i = 1;
        i < stroke.points.length;
        i++
    ) {

        ctx.lineTo(
            stroke.points[i].x,
            stroke.points[i].y
        );

    }


    ctx.strokeStyle =
    stroke.color || "#ffffff";

    ctx.lineWidth =
    stroke.size || 4;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.stroke();

}


/* =========================================================
   FIREBASE REALTIME SYNC
========================================================= */

const strokesRef =
ref(db, "blackboard/strokes");


onChildAdded(
    strokesRef,
    function(snapshot) {

        const stroke =
        snapshot.val();

        drawStroke(stroke);

    }
);


/* =========================================================
   CLEAR BOARD
========================================================= */

window.clearBoard =
async function() {

    const confirmed =
    confirm(
        "Erase everything for EVERYONE?"
    );

    if (!confirmed) return;

    await remove(strokesRef);

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

};


/* =========================================================
   COLORS
========================================================= */

window.setColor =
function(color, element) {

    currentColor = color;

    document
    .querySelectorAll(".color")
    .forEach(
        item =>
        item.classList.remove("active")
    );

    element.classList.add("active");

};


/* =========================================================
   BRUSH SIZE
========================================================= */

window.setSize =
function(size) {

    currentSize = size;

};


/* =========================================================
   ENTER BOARD
========================================================= */

window.enterBoard =
function() {

    document
    .getElementById("welcome")
    .style.display = "none";

};


/* =========================================================
   ONLINE PRESENCE
========================================================= */

const connectedRef =
ref(db, ".info/connected");

const presenceRef =
ref(
    db,
    "blackboard/presence/" +
    Math.random()
    .toString(36)
    .substring(2)
);


onValue(
    connectedRef,
    function(snapshot) {

        if (snapshot.val() === true) {

            set(
                presenceRef,
                true
            );

            onDisconnect(
                presenceRef
            ).remove();

        }

    }
);


const presenceCollection =
ref(db, "blackboard/presence");


onValue(
    presenceCollection,
    function(snapshot) {

        const count =
        snapshot.exists()
        ? Object.keys(snapshot.val()).length
        : 0;

        document
        .getElementById("onlineCount")
        .innerText =
        count + " people here";

    }
);

</script>

</body>
</html>
